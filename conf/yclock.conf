# yclock configuration file
# Copy this to ~/.yclock.conf to customize

# --- Colors ---

# Colors are in #RRGGBB or #RRGGBBAA hex format (the # is optional).
# AA is alpha: 00 is fully transparent (hides the element), ff is opaque.
# Without AA the color is fully opaque.
# Default theme: Catppuccin Macchiato

# Background color (default: #24273af2)
background = #24273af2

# Foreground color (text and clock hands)
foreground = #cad3f5

# Second hand color
second_hand = #ed8796

# Circle color (default: the foreground color)
# circle_color = #RRGGBB00 hides the circle
# circle_color = #cad3f5

# Mark colors; #RRGGBBAA, alpha 00 hides the tier
# Quarter marks: 12, 3, 6, 9 o'clock (default: the foreground color)
# quarter_mark_color = #cad3f5
# Hour marks: remaining multiples of 5 minutes (default: the foreground color)
# hour_mark_color = #cad3f5
# Minute marks: all other minute positions (default: the foreground color, hidden)
# minute_mark_color = #cad3f500

# --- Mode, font, dock ---

# Clock mode: digital or analog (default: analog)
mode = analog

# Font name for digital clock (optional)
# Examples: Menlo, Monaco, Courier, Helvetica, Arial
# If not specified, uses system monospaced font for time and regular font for date
# font = Menlo

# Show app in Dock and Cmd+Tab switcher (default: false)
# When false, app runs as an accessory and doesn't appear in Dock or Cmd+Tab
# show_in_dock = false

# Show seconds hand/display at startup (default: false)
# The --seconds command line option overrides this; Cmd+S toggles at runtime
# show_seconds = false

# --- Window ---

# Window width in base units (default: 100)
# On-screen size in pixels is width * scale
width = 100

# Window height in base units (default: 100)
height = 100

# Pixels per base unit, must be > 0 (default: 1.64)
scale = 1.64

# Window opacity, 0.0 (transparent) to 1.0 (opaque), applies to the whole window (default: 0.85)
# opacity = 0.85

# Window corner radius in base units, must be >= 0 (default: 7.3)
# Capped at half the shorter window side, so a large value (e.g. 1000)
# makes a square window round and a non-square one a capsule
# corner_radius = 7.3

# Window shadow: default (system behaviour), enable or disable (default: default)
# The shadow follows the visible shape, so with a round window it appears as a ring around it
# window_shadow = default

# --- Clock face ---

# Clock circle diameter in base units, must be > 0 (default: 87.8)
# With the default 100x100 window this leaves a small margin;
# values larger than the window are clipped
# clock_size = 87.8

# Hand widths in base units, must be >= 0, 0 hides the hand (defaults: 3.7, 2.4, 1.2)
# hour_hand_width = 3.7
# minute_hand_width = 2.4
# second_hand_width = 1.2

# Circle line width in base units, must be >= 0 (default: 1.2)
# 0 hides the circle
# circle_width = 1.2

# Mark sizes in base units (defaults: 1.2x4.4 for hour and quarter, 1.2 for minute)
# WxL: W is the width along the circle, L the length towards the centre
# One or two numbers >= 0 separated by any non-numeric characters
# (1.2x4.4, 1.2:4.4, 1.2 x 4.4); a single number N means NxN
# A mark with W or L of 0 is not drawn
# quarter_mark_size = 1.2x4.4
# hour_mark_size = 1.2x4.4
# minute_mark_size = 1.2

# Distance from the clock circle to the outer end of dashes or the centre of dots in base units,
# must be >= 0 (default: 2.2)
# mark_inset = 2.2

# Mark style: dashes or dots (default: dashes)
# A dot is an ellipse of W x L, so a single-number size N gives a round dot of diameter N
# mark_style = dashes
# Dotted face without the circle:
# circle_color = #cad3f500
# mark_style = dots
# minute_mark_color = #cad3f5
# minute_mark_size = 1
# hour_mark_size = 2
# quarter_mark_size = 3

# --- Click-through ---

# With click_through the window ignores the mouse (clicks go to windows underneath)
# until unlocked. Hover the pointer over the clock (holding unlock_modifier, if set):
# a ring fills along the window edge; when it is full the window flashes and gets a
# red ring, which means unlocked: it takes clicks, can be dragged, and has a shadow
# and full opacity. Activating the app (launching it again, `open -a yclock`) also unlocks.
# Moving the pointer out without clicking, or switching to another app, re-locks
# with the ring draining. After re-locking, hover unlock re-arms once the pointer has
# left the window.
# While unlocked, holding unlock_modifier (if set) with the pointer on the clock drags it
# without clicking; the clock stays fully on screen and stays unlocked until the
# modifier is released.

# true or false (also 1 and 0, default: false)
# click_through = false

# While unlocked, show the app in the Dock, Cmd+Tab and menu bar. Only applies
# with click_through = true; no effect when show_in_dock is on (the app is then
# always in the Dock and Cmd+Tab). true or false (default: false)
# unlocked_in_app_switcher = false

# Seconds the pointer must hover to unlock, must be >= 0 (default: 2)
# 0 disables hover unlock (only app activation unlocks) and re-locks instantly
# unlock_hover_delay = 2

# Modifiers that must be held while hovering (default: shift)
# Names: cmd/command, opt/option/alt, ctrl/control, shift, separated by any non-letters
# none (or empty) requires no modifier
# Holding cmd/option while clicking an inactive app's window has macOS side effects
# (cmd+option-click hides other apps, option-click hides the previous app), hence shift
# unlock_modifier = shift

# Ring width in base units, must be >= 0 (default: 10), at least 2 pixels on screen
# unlock_ring_width = 10

# Ring colors, alpha is ignored
# While unlocking (default: the foreground color)
# unlocking_color = #cad3f5
# Once unlocked (default: #c00000)
# unlocked_color = #c00000
